<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1012"/>
      <stop offset="1" stop-color="#0d0a0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#e3283a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e3283a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="1" stop-color="#b8892f"/>
    </linearGradient>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e6fb0"/>
      <stop offset="1" stop-color="#a7c4e4"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a35e"/>
      <stop offset="1" stop-color="#7a3b52"/>
    </linearGradient>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20384f"/>
      <stop offset="1" stop-color="#5d8a8c"/>
    </linearGradient>
    <linearGradient id="sky4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c7a3"/>
      <stop offset="1" stop-color="#8f7a58"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1718"/>
      <stop offset="1" stop-color="#141112"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Title block -->
  <g transform="translate(72 150)">
    <text x="0" y="0" font-size="20" font-weight="600" letter-spacing="3" fill="#e3283a">SWIFT PACKAGE · iPadOS · macOS</text>
    <text x="0" y="78" font-size="60" font-weight="800" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif">MetMuseumKit</text>
    <text x="0" y="128" font-size="24" fill="#d9cfcf">The Met's open collection API in Swift,</text>
    <text x="0" y="160" font-size="24" fill="#d9cfcf">with an iPad and Mac gallery app.</text>

    <g font-size="17" font-weight="600" fill="#f4ecec">
      <g transform="translate(0 205)">
        <rect width="120" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="60" y="25" text-anchor="middle">Search</text>
      </g>
      <g transform="translate(132 205)">
        <rect width="172" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="86" y="25" text-anchor="middle">Departments</text>
      </g>
      <g transform="translate(316 205)">
        <rect width="140" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="70" y="25" text-anchor="middle">Highlights</text>
      </g>
      <g transform="translate(0 255)">
        <rect width="232" height="38" rx="19" fill="#e3283a" fill-opacity="0.22" stroke="#e3283a" stroke-opacity="0.6"/>
        <text x="116" y="25" text-anchor="middle">Public domain images</text>
      </g>
      <g transform="translate(244 255)">
        <rect width="236" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="118" y="25" text-anchor="middle">Throttled · concurrent</text>
      </g>
      <g transform="translate(0 305)">
        <rect width="160" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="80" y="25" text-anchor="middle">async / await</text>
      </g>
      <g transform="translate(172 305)">
        <rect width="156" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="78" y="25" text-anchor="middle">SwiftUI views</text>
      </g>
    </g>
  </g>

  <!-- Mac -->
  <g transform="translate(700 92) scale(0.93)">
    <rect x="0" y="0" width="560" height="360" rx="18" fill="#2a2627" stroke="#4a4446" stroke-width="2"/>
    <rect x="14" y="14" width="532" height="332" rx="8" fill="url(#screen)"/>
    <circle cx="34" cy="32" r="5" fill="#ff5f57"/>
    <circle cx="52" cy="32" r="5" fill="#febc2e"/>
    <circle cx="70" cy="32" r="5" fill="#28c840"/>
