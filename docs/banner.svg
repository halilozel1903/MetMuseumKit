      <rect x="28" y="280" width="60" height="7" rx="3.5" fill-opacity="0.25"/>
      <rect x="100" y="280" width="120" height="7" rx="3.5" fill-opacity="0.35"/>
    </g>
  </g>

  <text x="72" y="596" font-size="16" fill="#9d9192">Images: The Met Open Access (public domain, CC0) · Unofficial client</text>
</svg>
