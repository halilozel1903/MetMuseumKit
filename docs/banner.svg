  <!-- iPad -->
  <g transform="translate(640 300)">
    <rect x="0" y="0" width="250" height="320" rx="22" fill="#1b1819" stroke="#4a4446" stroke-width="2"/>
    <rect x="12" y="12" width="226" height="296" rx="12" fill="url(#screen)"/>
    <g transform="translate(28 30)">
