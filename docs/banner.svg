      <rect x="28" y="88" width="96" height="8" rx="4"/>
      <rect x="28" y="110" width="70" height="8" rx="4"/>
      <rect x="28" y="154" width="88" height="8" rx="4"/>
      <rect x="28" y="176" width="64" height="8" rx="4"/>
      <rect x="28" y="198" width="92" height="8" rx="4"/>
      <rect x="28" y="242" width="76" height="8" rx="4"/>
      <rect x="28" y="264" width="84" height="8" rx="4"/>
    </g>
    <rect x="22" y="128" width="114" height="20" rx="6" fill="#e3283a" fill-opacity="0.85"/>
    <rect x="30" y="134" width="70" height="8" rx="4" fill="#ffffff" fill-opacity="0.9"/>
