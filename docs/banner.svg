    <g transform="translate(162 66)">
      <rect width="112" height="128" rx="6" fill="url(#gold)"/>
      <rect x="8" y="8" width="96" height="112" fill="url(#sky1)"/>
      <path d="M8 88 Q 40 70 70 84 T 104 80 L 104 120 L 8 120 Z" fill="#d9a83a"/>
      <path d="M38 88 C 34 70 40 46 44 26 C 48 46 52 70 48 88 Z" fill="#1f3b22"/>

      <rect x="126" width="112" height="128" rx="6" fill="url(#gold)"/>
      <rect x="134" y="8" width="96" height="112" fill="url(#sky2)"/>
      <circle cx="182" cy="58" r="16" fill="#fde3b0"/>
      <path d="M134 96 L 160 78 L 182 92 L 208 70 L 230 90 L 230 120 L 134 120 Z" fill="#3a2230"/>

      <rect x="252" width="112" height="128" rx="6" fill="url(#gold)"/>
      <rect x="260" y="8" width="96" height="112" fill="url(#sky3)"/>
      <path d="M260 92 Q 290 80 320 94 T 356 88 L 356 120 L 260 120 Z" fill="#c9d8d2" fill-opacity="0.6"/>
      <path d="M296 44 l 22 -14 l 6 30 z" fill="#f0efe6"/>

      <rect y="146" width="112" height="112" rx="6" fill="url(#gold)"/>
      <rect x="8" y="154" width="96" height="96" fill="url(#sky4)"/>
      <ellipse cx="56" cy="196" rx="20" ry="26" fill="#6b4f3a"/>
      <rect x="36" y="216" width="40" height="34" rx="12" fill="#3d2c22"/>

      <rect x="126" y="146" width="112" height="112" rx="6" fill="url(#gold)"/>
      <rect x="134" y="154" width="96" height="96" fill="#20284a"/>
      <circle cx="160" cy="180" r="4" fill="#fbe7a1"/>
      <circle cx="200" cy="172" r="3" fill="#fbe7a1"/>
      <circle cx="214" cy="200" r="5" fill="#fbe7a1"/>
      <path d="M134 230 Q 182 208 230 232 L 230 250 L 134 250 Z" fill="#141a33"/>

      <rect x="252" y="146" width="112" height="112" rx="6" fill="url(#gold)"/>
      <rect x="260" y="154" width="96" height="96" fill="#e9e1cf"/>
      <path d="M276 236 C 290 196 300 186 308 170 C 316 186 326 196 340 236 Z" fill="#9b2d2f" fill-opacity="0.8"/>
    </g>
    <rect x="230" y="360" width="100" height="26" fill="#2a2627"/>
    <rect x="180" y="384" width="200" height="10" rx="5" fill="#3a3436"/>
