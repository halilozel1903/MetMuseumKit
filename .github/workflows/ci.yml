name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  test:
    name: Tests (iPadOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build & test on an iPad simulator
        run: bash scripts/test.sh iOS

  example:
    name: Example apps
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: Example
        run: xcodegen generate
      - name: Build for iPad Simulator
        run: |
          xcodebuild build \
            -project Example/MetGallery.xcodeproj \
            -scheme MetGallery \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for macOS
        run: |
          xcodebuild build \
            -project Example/MetGallery.xcodeproj \
            -scheme MetGalleryMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  screenshots:
    name: README screenshots
    if: github.event_name != 'pull_request'
    needs: [swift, test, example]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: Example
        run: xcodegen generate
      - name: Check the live API
        run: |
          # Only a log line: the capture steps below fail on their own when the API is down.
          curl -sS -o /dev/null -w "departments: HTTP %{http_code}\n" \
            https://collectionapi.metmuseum.org/public/collection/v1/departments || true
      # Live data and images from The Met; writes mac-departments.png and mac-search.png.
      - name: Capture Mac screenshots
        run: bash scripts/screenshots-mac.sh MetGalleryMac departments search
      # Live data and images from The Met; writes ipad-gallery.png and ipad-object.png.
      - name: Capture iPad screenshots
        run: bash scripts/screenshots-ipad.sh MetGallery io.github.halilozel1903.MetGallery gallery object
      - name: Commit screenshots
        run: |
          git config user.name "Halil Özel"
          git config user.email "halilozel1903@gmail.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update README screenshots [skip ci]"
            git push
          fi
